<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DarkWeb Messenger</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>


<body>

<div class="background"></div>


<div class="messenger">


<!-- ЛЕВАЯ ПАНЕЛЬ -->

<aside class="sidebar">


<div class="side-logo">

<div class="logo-icon">
⬢
</div>

<h2>
DarkWeb
</h2>

</div>



<div class="search">

<input 
placeholder="🔍 Поиск">

</div>



<div class="menu">


<div class="menu-item active">

⭐ Избранное

</div>


<div class="menu-item">

💬 Сообщения

</div>


<div class="menu-item">

👥 Контакты

</div>


<div class="menu-item">

📢 Каналы

</div>



<div class="menu-item">

💎 Dark Premium

</div>


</div>



<div class="profile-mini">


<div class="avatar">

👤

</div>


<div>

<p id="userName">

User

</p>


<span>

Online

</span>

</div>


</div>



</aside>





<!-- ОКНО ЧАТА -->


<main class="chat">


<div class="chat-header">


<div>

<h3>

⭐ Избранное

</h3>


<p>

Личное пространство

</p>

</div>



<button id="logout">

Выйти

</button>


</div>




<div class="messages">


<div class="welcome">


<div class="logo-icon">

⬢

</div>


<h2>

Добро пожаловать в DarkWeb

</h2>


<p>

Ваше безопасное пространство

</p>


</div>


</div>





<div class="message-box">


<input

placeholder="Написать сообщение..."
>


<button>

➤

</button>


</div>



</main>


</div>




<script type="module" src="firebase.js"></script>

<script type="module" src="app.js"></script>


</body>

</html>
